version: 2

sources:
  - name: raw
    description: "Datos crudos cargados por dlt desde PLACSP."
    schema: raw
    tables:
      - name: licitaciones
        description: "Entradas ATOM de licitaciones (perfiles del contratante)."
        columns:
          - name: entry_id
            description: "Identificador único de la entrada ATOM."
            tests:
              - not_null
              - unique
          - name: expediente
            description: "Identificador del expediente de contratación."
