[project]
name = "radar-contratacion"
version = "0.1.0"
description = "Inteligencia sobre contratación pública española: ingesta, análisis y agente conversacional."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "polars>=1.0",
    "duckdb>=1.0",
]

[project.optional-dependencies]
ingestion = [
    "dlt[duckdb]>=1.0",
    "lxml>=5.2",          # parseo de ATOM/CODICE
]
transform = [
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
]
orchestration = [
    "dagster>=1.7",
    "dagster-webserver>=1.7",
    "dagster-dbt>=0.23",
]
analytics = [
    "scikit-learn>=1.5",
    "statsmodels>=0.14",
    "numpy>=1.26",
    "pandas>=2.2",
]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.34",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    # Trazas del agente. La API v4 (start_observation/as_type) no es
    # compatible con la de la v2, ver api/observabilidad.py.
    "langfuse>=4.0",
    # Auth (semana 7a): hash de contraseñas y JWT.
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "email-validator>=2.0",  # valida el formato de email en pydantic.EmailStr
    # Billing (semana 7b).
    "stripe>=11.0",
]
search = [
    "sentence-transformers>=3.0",  # embeddings locales (arrastra torch)
    "torch>=2.0",  # explícito para que tool.uv.sources fije el índice CPU
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
]
mcp = [
    # <2.0: la 2.0.0 (28/07/2026) es una reescritura mayor del SDK para la
    # nueva versión del protocolo, incompatible con mcp_server/server.py y
    # auth_middleware.py (rompe al menos mcp.server.fastmcp.FastMCP). El
    # proyecto mantiene una rama 1.x con parches para quien no haya migrado.
    "mcp>=1.0,<2.0",
]
# Sin extra propio: los evals solo necesitan `anthropic` y `pydantic` (extra
# `api`) y, para las métricas de recuperación, el extra `search`. Se quitó
# `ragas` porque su versión actual no importa con el stack de langchain
# instalado; las métricas de recuperación viven en evals/retrieval.py
# (ver evals/README.md).

[dependency-groups]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
    "ipykernel>=6.29",
    "jupyter>=1.0",
]

[tool.uv.sources]
# CPU-only: nada en este proyecto entrena en GPU (embeddings de
# sentence-transformers sobre modelos pequeños), y el wheel con CUDA de
# PyPI arrastra varios GB de librerías nvidia-* de más — eso fue lo que
# llenó el disco durante la primera verificación del build de Docker.
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["ingestion/tests", "analytics/tests", "search/tests", "api/tests", "evals"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "orchestration", "api", "mcp_server", "analytics", "search"]
