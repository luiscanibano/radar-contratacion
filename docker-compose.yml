# Stack completo para el VPS (4 vCPU / 8 GB). Todo cabe holgadamente.
# En desarrollo basta con `docker compose up -d postgres`.
name: radar-contratacion

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-radar}
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      # Solo loopback: el contenedor `api` la alcanza por la red interna de
      # Docker sin necesidad de publicar el puerto; esto es para poder
      # conectar herramientas locales (psql, DBeaver...) desde el propio
      # host. Publicarlo en todas las interfaces dejaría Postgres alcanzable
      # desde internet si el firewall del VPS no lo bloquea aparte.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-radar}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  # Reverse proxy con HTTPS automático (Let's Encrypt). Opcional (perfil
  # "standalone-caddy"): en un VPS dedicado solo a este proyecto, levántalo
  # con `docker compose --profile standalone-caddy up -d`. En un VPS
  # compartido con otro proyecto que ya ocupe el 80/443 (un único reverse
  # proxy para todo el host), no lo actives — conecta el servicio `api` a la
  # red Docker de ese Caddy existente y añade un bloque de sitio ahí en su
  # lugar (ver README > Despliegue en producción).
  caddy:
    image: caddy:2-alpine
    profiles: ["standalone-caddy"]
    env_file: .env  # Caddyfile lee $DOMAIN del entorno del proceso
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  # Orquestación. Levantar con: docker compose --profile orchestration up -d
  dagster:
    build:
      context: .
      dockerfile: orchestration/Dockerfile
    profiles: ["orchestration"]
    env_file: .env
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"

  # Observabilidad self-hosted (opcional). Por defecto usamos Langfuse Cloud
  # free tier. Descomenta si prefieres self-host — pesa ~1.5 GB de RAM extra.
  # langfuse:
  #   image: langfuse/langfuse:2
  #   profiles: ["observability"]
  #   depends_on: [postgres]
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/langfuse
  #     NEXTAUTH_SECRET: change-me
  #     SALT: change-me
  #   ports: ["3001:3000"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
