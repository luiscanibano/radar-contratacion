name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    name: Tests + lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: radar
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: change-me
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - name: Instalar uv
        uses: astral-sh/setup-uv@v7

      # Sin --locked: aquí sí queremos detectar si algo dejó de resolver bien
      # (al revés que en el Dockerfile de producción, que fija exactamente
      # uv.lock). Si esto falla, el problema está en el propio lock.
      - name: Instalar dependencias (todos los extras)
        run: uv sync --all-extras

      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .

      # Postgres real vía el service de arriba; el resto de tests (DuckDB,
      # Anthropic/Stripe mockeados) no necesitan nada externo.
      - name: pytest
        run: uv run pytest api/tests

  deploy:
    name: Desplegar en el VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH y redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/radar-contratacion
            git fetch origin main
            git checkout main
            git merge --ff-only origin/main
            docker compose up -d --build --force-recreate api
            docker network connect vps_default radar-contratacion-api-1 || true

      - name: Comprobar que responde en el dominio
        run: |
          sleep 5
          curl -sf https://radarcontratacion.com/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null https://radarcontratacion.com/legal
