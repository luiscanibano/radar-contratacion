<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago cancelado · Radar de Contratación Pública</title>
<style>
  @font-face {
    font-family: "Archivo";
    src: url("/static/fonts/archivo-vf.woff2") format("woff2-variations");
    font-weight: 100 900;
    font-display: swap;
  }
  :root {
    --papel:#f4f5f4; --tinta:#16181a; --tinta-suave:#575d61; --regla:#d8dbd9;
    --acento:#2647c1; --acento-hover:#1c37a0;
    --sans:"Archivo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --papel:#121415; --tinta:#e8eae9; --tinta-suave:#9aa1a5; --regla:#272b2d;
      --acento:#93a7ff; --acento-hover:#b0bfff;
    }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: var(--sans);
    background: var(--papel); color: var(--tinta); line-height: 1.6;
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
    padding: 1.5rem;
  }
  .aviso {
    max-width: 460px; padding: 2.25rem 0;
    border-top: 1px solid var(--regla); border-bottom: 1px solid var(--regla);
  }
  .icono { color: var(--tinta-suave); }
  h1 { font-size: 1.45rem; font-weight: 640; letter-spacing: -0.02em; margin: .9rem 0 .5rem; }
  p { color: var(--tinta-suave); margin-bottom: 1.6rem; text-wrap: pretty; }
  .boton {
    display: inline-block; background: var(--tinta); color: var(--papel);
    padding: .6rem 1.2rem; border-radius: 6px; text-decoration: none; font-weight: 560;
    transition: transform 160ms cubic-bezier(0.23, 1, 0.32, 1), background-color 160ms ease, color 160ms ease;
  }
  .boton:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) { .boton:hover { background: var(--acento-hover); color: #fff; } }
  @media (prefers-color-scheme: dark) {
    @media (hover: hover) and (pointer: fine) { .boton:hover { color: #101315; } }
  }
  .boton:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="aviso">
    <!-- Icono: Tabler Icons, arrow-back-up (MIT) -->
    <svg class="icono" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 14l-4 -4l4 -4" />
      <path d="M5 10h11a4 4 0 1 1 0 8h-1" />
    </svg>
    <h1>Pago cancelado</h1>
    <p>No se ha realizado ningún cargo. Puedes volver al panel y suscribirte
    cuando quieras. Tu plan actual sigue activo.</p>
    <a class="boton" href="/app">Volver al panel</a>
  </div>
</body>
</html>
