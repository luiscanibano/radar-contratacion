<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pago cancelado — Radar de Contratación Pública</title>
<style>
  :root { --fondo:#ffffff; --tinta:#1a2233; --tinta-suave:#5a6478; --acento:#0d5c63; --acento-tinta:#ffffff; --borde:#e3e7ee; --tarjeta:#f7f9fb; }
  @media (prefers-color-scheme: dark) {
    :root { --fondo:#10141c; --tinta:#e8ecf3; --tinta-suave:#9aa4b5; --acento:#35a7b1; --acento-tinta:#0b1016; --borde:#26303f; --tarjeta:#171d28; }
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--fondo); color: var(--tinta); line-height: 1.6;
    min-height: 100vh; display: grid; place-items: center; padding: 1.25rem;
  }
  .tarjeta {
    background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 12px;
    padding: 2.5rem; max-width: 480px; text-align: center;
  }
  .icono { font-size: 2.5rem; }
  h1 { font-size: 1.4rem; margin: .75rem 0 .5rem; }
  p { color: var(--tinta-suave); margin-bottom: 1.5rem; }
  .boton {
    display: inline-block; background: var(--acento); color: var(--acento-tinta);
    padding: .6rem 1.2rem; border-radius: 8px; text-decoration: none; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="icono">↩️</div>
    <h1>Pago cancelado</h1>
    <p>No se ha realizado ningún cargo. Puedes volver al panel y suscribirte
    cuando quieras — tu plan actual sigue activo.</p>
    <a class="boton" href="/app">Volver al panel</a>
  </div>
</body>
</html>
